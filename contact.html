<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact — JOUD</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="on-light">

<header class="site-header" id="site-header"></header>

<main id="main">
  <div class="page-header">
    <p class="eyebrow">Client Services</p>
    <h1 class="page-title">Contact</h1>
    <p class="breadcrumb"><a href="index.html">Home</a> / Contact</p>
  </div>

  <div class="contact-layout">
    <div>
      <form id="contact-form" novalidate>
        <div class="form-row">
          <div class="form-field" data-field="name">
            <label for="c-name">Full Name</label>
            <input id="c-name" name="name" type="text" placeholder="Jane Doe" />
            <span class="field-error"></span>
          </div>
          <div class="form-field" data-field="email">
            <label for="c-email">Email</label>
            <input id="c-email" name="email" type="email" placeholder="jane@email.com" />
            <span class="field-error"></span>
          </div>
        </div>
        <div class="form-field" data-field="subject" style="margin-bottom:18px;">
          <label for="c-subject">Subject</label>
          <select id="c-subject" name="subject">
            <option value="">Select a topic</option>
            <option>Order Support</option>
            <option>Returns &amp; Exchanges</option>
            <option>Wholesale Inquiry</option>
            <option>Press</option>
            <option>Other</option>
          </select>
          <span class="field-error"></span>
        </div>
        <div class="form-field" data-field="message" style="margin-bottom:18px;">
          <label for="c-message">Message</label>
          <textarea id="c-message" name="message" rows="6" placeholder="How can we help?" style="border:1px solid var(--line-strong); padding:12px; font-size:14px; resize:vertical;"></textarea>
          <span class="field-error"></span>
        </div>
        <button type="submit" class="btn btn-gold">Send Message</button>
      </form>
    </div>

    <div>
      <div class="contact-info-block" data-reveal>
        <h4>Client Services</h4>
        <a href="mailto:hello@joud.com">hello@joud.com</a>
        <a href="tel:+201000000000">+20 10 000 0000</a>
      </div>
      <div class="contact-info-block" data-reveal>
        <h4>Flagship Studio</h4>
        <p>14 El Haram Street</p>
        <p>Giza, Egypt</p>
      </div>
      <div class="contact-info-block" data-reveal>
        <h4>Hours</h4>
        <p>Sunday – Thursday, 10:00 – 19:00</p>
      </div>
      <div class="social-row" data-reveal>
        <a href="#">Instagram</a>
        <a href="#">TikTok</a>
        <a href="#">Pinterest</a>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>
<div id="site-overlays"></div>

<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/layout.js"></script>
<script>
  injectLayout("contact");
  initScrollReveal();

  // Brand's WhatsApp number (digits only, country code included, no "+")
  const WHATSAPP_NUMBER = "201033515073";

  const form = document.getElementById("contact-form");

  function setFieldError(field, message) {
    const wrap = form.querySelector(`[data-field="${field}"]`);
    wrap.classList.toggle("has-error", !!message);
    wrap.querySelector(".field-error").textContent = message || "";
  }

  function validateContact() {
    let valid = true;
    const name = form.name.value.trim();
    const email = form.email.value.trim();
    const subject = form.subject.value;
    const message = form.message.value.trim();

    if (!name) { setFieldError("name", "Please enter your name."); valid = false; }
    else setFieldError("name", "");

    if (!email) { setFieldError("email", "Please enter your email."); valid = false; }
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setFieldError("email", "Enter a valid email address."); valid = false; }
    else setFieldError("email", "");

    if (!subject) { setFieldError("subject", "Please select a topic."); valid = false; }
    else setFieldError("subject", "");

    if (!message || message.length < 10) { setFieldError("message", "Message should be at least 10 characters."); valid = false; }
    else setFieldError("message", "");

    return valid;
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (!validateContact()) {
      showToast("Please check the highlighted fields");
      return;
    }

    const name = form.name.value.trim();
    const email = form.email.value.trim();
    const subject = form.subject.value;
    const message = form.message.value.trim();

    const whatsappMessage =
      "New message from the JOUD website:\n\n" +
      "Name: " + name + "\n" +
      "Email: " + email + "\n" +
      "Subject: " + subject + "\n" +
      "Message: " + message;

    const whatsappUrl = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(whatsappMessage);

    showToast("Redirecting you to WhatsApp");
    form.reset();
    window.location.href = whatsappUrl;
  });
</script>
</body>
</html>
